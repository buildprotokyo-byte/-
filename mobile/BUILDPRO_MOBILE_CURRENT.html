function bindChange(){$('closeChange').onclick=()=>{stopSpeech();overlay.innerHTML=''};document.querySelectorAll('[data-impact]').forEach(b=>b.onclick=()=>{const k=b.dataset.impact;impact.has(k)?impact.delete(k):impact.add(k);b.classList.toggle('on',impact.has(k));renderNumbers()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{impactLevel=b.dataset.level;if(changeStatus==='urgent'&&impactLevel==='large')impactLevel='critical';document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('on',x===b))});$('mic').onclick=voice;if($('nativeVoice'))$('nativeVoice').onclick=()=>nativeDictation('note','voiceStatus','mic');$('saveChange').onclick=async()=>{if(!impact.size)return toast('影響する項目を選んでください');const note=$('note').value.trim();if(!note)return toast('何が起きたかを音声または文字で登録してください');const days=Number($('days')?.value||0),money=Number($('money')?.value||0);stopSpeech();overlay.innerHTML='';await saveOne(changeStatus,{impacts:[...impact],impactLevel,scheduleDeltaDays:days,budgetDelta:money,note})};renderNumbers()}

async function micPermission(){try{if(navigator.permissions?.query){try{const p=await navigator.permissions.query({name:'microphone'});if(p.state==='denied')return {ok:false,state:'denied'};if(p.state==='granted'){try{localStorage.setItem('bp_mobile_mic_granted','1')}catch(_){}return {ok:true,state:'granted'}}}catch(_){}}const remembered=(()=>{try{return localStorage.getItem('bp_mobile_mic_granted')==='1'}catch(_){return false}})();if(remembered)return {ok:true,state:'remembered'};if(navigator.mediaDevices?.getUserMedia&&window.isSecureContext){const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());try{localStorage.setItem('bp_mobile_mic_granted','1')}catch(_){}return {ok:true,state:'granted'}}return {ok:true,state:'browser-managed'}}catch(e){return {ok:false,state:e?.name||'error',error:e}}}

async function startVoice(targetId='note',btnId='mic',statusId='voiceStatus'){const ta=$(targetId),st=$(statusId),btn=$(btnId);if(!ta||!st||!btn)return;if(voiceListening){stopSpeech();return}const SR=speechCtor();if(!SR){nativeDictation(targetId,statusId,btnId,'unsupported');return}const perm=await micPermission();if(!perm.ok){nativeDictation(targetId,statusId,btnId,perm.state);return}voiceListening=true;voiceCtx={targetId,btnId,statusId};btn.classList.remove('native');btn.classList.add('listening');btn.textContent='■ 音声入力を停止';st.className='voiceStatus ok';st.textContent='聞き取り中です。そのまま予定を話してください。';const cycle=()=>{if(!voiceListening||!voiceCtx)return;const r=new SR();speech=r;r.lang='ja-JP';r.interimResults=true;try{r.continuous=!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)}catch(_){}const base=ta.value.trim(),finalParts=[];r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)finalParts.push(txt);else interim+=txt}const parts=[base,...finalParts,interim].filter(Boolean);ta.value=parts.join(' ').replace(/\s+/g,' ').trim();ta.dispatchEvent(new Event('input',{bubbles:true}))};r.onerror=e=>{const code=e?.error||'unknown';if(code==='no-speech'&&voiceListening)return;voiceListening=false;st.className='voiceStatus err';st.textContent=(lanHttpVoiceBlocked()&&(code==='not-allowed'||code==='service-not-allowed')?'この端末ではHTTP接続のマイクが拒否されました。HTTPS版で一押し入力が可能になります。 ':'')+voiceErrorText(code);btn.classList.remove('listening');btn.textContent='🎤 もう一度音声入力'};r.onend=()=>{speech=null;if(voiceListening){setTimeout(cycle,220)}else{btn.classList.remove('listening');if(!btn.classList.contains('native'))btn.textContent=btn.id==='updReasonMic'?'🎤 理由を音声で入力':'🎤 音声で入力する'}};try{r.start()}catch(e){voiceListening=false;speech=null;st.className='voiceStatus err';st.textContent=voiceErrorText(e?.name||'start');btn.classList.remove('listening');btn.textContent='🎤 もう一度音声入力'}};cycle()}

function guidance(q){const s=String(q||'');if(/ホーム|デスクトップ|追加|アプリ/.test(s))return['携帯ホーム画面へ追加',['iPhoneはSafari下部の共有ボタン →「ホーム画面に追加」→「追加」です。','AndroidはChrome右上の︙→「ホーム画面に追加」または「アプリをインストール」です。','携帯版はインターネット上のページとして開くため、Wi-Fiでもデータ通信でも利用できます。PCの起動画面を閉じても使えます。']];if(/Outlook|アウトルック|予定/.test(s))return['自分のOutlook予定',['ホームの「自分のOutlook予定を見る」を開きます。','日・週・月を切り替え、件名・日時・場所・参加者を確認します。','表示されない場合は「本人情報・サーバー接続確認」で会社メールと社員IDを確認します。現在は読み取り専用です。']];if(/ログイン|パスワード|ID|開始/.test(s))return['初回ログイン',['会社メール＋管理者から本人へ届いたBUILD PRO専用パスワードを使います。','ログイン後、メニュー →「本人情報・サーバー接続確認」を開きます。','氏名・会社メール・社員ID・権限と「接続OK」が本人と一致するまで業務入力を始めません。']];if(/現場|変更|登録|日次/.test(s))return['今日の現場管理',['対象現場と日付を確認します。','工程・予算・品質・コミュニケーションを確認し、変更なし／変更あり／緊急を登録します。','登録後に残件数と今日の登録履歴が更新されたことを確認します。']];return[`${current()}の次の操作`,['対象の本人名・現場名・日付が正しいか確認します。','上から必要項目を入力し、登録ボタンは一度だけ押します。','完了表示・件数・履歴のいずれかが更新されたことを確認します。']]}
function answer(q){const [title,items]=guidance(q),out=document.getElementById('bpmgAnswer');out.innerHTML=`<b>${esc(title)}</b><ol>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function install(){if(document.getElementById('bpMobileGuide'))return;document.body.insertAdjacentHTML('beforeend',`<button id="bpMobileGuideBtn" type="button">◆ AIに聞く</button><div id="bpMobileGuide" role="dialog" aria-modal="true"><section class="bpmgSheet"><div class="bpmgHead"><h2>迷ったらAIに相談</h2><button class="bpmgClose" type="button">×</button></div><div class="bpmgStatus">内蔵伴走AIは動作中です。LM Studioなどの追加インストールは不要です。</div><div class="bpmgQuick"><button data-q="初回ログイン">初回ログイン</button><button data-q="Outlook予定">Outlook予定</button><button data-q="今日の現場管理">現場管理</button><button data-q="ホーム画面に追加">ホームへ追加</button></div><textarea id="bpmgInput" class="bpmgInput" placeholder="例：この画面で次に何をしますか"></textarea><button id="bpmgAsk" class="bpmgAsk" type="button">AIに聞く</button><button id="bpmgInstall" class="bpmgInstall" type="button">この携帯のホーム画面へ追加</button><div id="bpmgAnswer" class="bpmgAnswer">質問を選ぶか、困っていることを入力してください。</div></section></div>`);const shell=document.getElementById('bpMobileGuide');document.getElementById('bpMobileGuideBtn').onclick=()=>shell.classList.add('open');shell.querySelector('.bpmgClose').onclick=()=>shell.classList.remove('open');shell.onclick=e=>{if(e.target===shell)shell.classList.remove('open')};shell.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answer(b.dataset.q));document.getElementById('bpmgAsk').onclick=()=>answer(document.getElementById('bpmgInput').value);document.getElementById('bpmgInstall').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else answer('ホーム画面に追加')}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();window.__BUILD_PRO_MOBILE_GUIDE__={version:'13.7.40',lmStudioRequired:false,guidance}}
)();
</script>
</body></html>
