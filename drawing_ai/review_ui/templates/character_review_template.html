<title>読取り検証デスク</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink-900:#10151c;
    --navy-800:#172335;
    --navy-700:#1e2c42;
    --navy-600:#2b3c58;
    --line:#3a4a66;
    --paper:#f3f0e8;
    --paper-line:#d8d2c2;
    --accent:#d97b3f;
    --accent-soft:#f0b98a;
    --ok:#3fa66b;
    --ok-bg:rgba(63,166,107,.16);
    --warn:#d9a441;
    --warn-bg:rgba(217,164,65,.18);
    --danger:#e2604a;
    --danger-bg:rgba(226,96,74,.18);
    --reviewed:#5b8dd9;
    --reviewed-bg:rgba(91,141,217,.18);
    --text-hi:#eef1f6;
    --text-lo:#9fb0c7;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    background:var(--ink-900);
    color:var(--text-hi);
    font-family:'Noto Sans JP',sans-serif;
    margin:0;
    overflow:hidden; /* the viewer/3D scene manage their own scrolling; the page itself must not grow taller than the viewport */
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3,.disp{font-family:'Zen Kaku Gothic New',sans-serif;}

  /* ---------- shell ---------- */
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
  .topbar{
    background:var(--navy-800); border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    position:sticky; top:0; z-index:40;
  }
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brand .mark{
    width:30px;height:30px;border-radius:7px;background:linear-gradient(145deg,var(--accent),#a8552a);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Zen Kaku Gothic New';
    color:#1a0e06; font-size:15px; flex:none;
  }
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;}
  .brand .sub{font-size:11.5px;color:var(--text-lo);}

  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    display:flex; align-items:center; gap:8px;
    background:var(--navy-700); border:1px solid var(--line); border-radius:9px;
    padding:8px 12px; cursor:pointer; color:var(--text-lo); font-size:13px; font-weight:500;
    transition:background .15s, color .15s, border-color .15s;
    white-space:nowrap;
  }
  .tab .n{font-size:10.5px; opacity:.75;}
  .tab.active{background:var(--accent); color:#1a0e06; border-color:var(--accent); font-weight:700;}
  .tab.locked{opacity:.42; cursor:not-allowed;}
  .tab .pill{
    font-size:10.5px; padding:1px 7px; border-radius:99px; background:rgba(255,255,255,.12);
    font-family:'JetBrains Mono'; font-variant-numeric:tabular-nums;
  }
  .tab.active .pill{background:rgba(0,0,0,.18);}
  .tab .lock{font-size:12px;}

  .main{display:flex; flex:1; min-height:0;}
  .stage{flex:1; position:relative; min-width:0; min-height:0; display:flex; flex-direction:column;}
  .stage-toolbar{
    display:flex; align-items:center; gap:10px; padding:10px 16px;
    background:var(--navy-700); border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .stage-toolbar .legend{display:flex; gap:14px; margin-left:auto; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-lo);}
  .swatch{width:11px;height:11px;border-radius:3px; flex:none;}
  .sw-green{background:var(--ok);}
  .sw-amber{background:var(--warn);}
  .sw-red{background:var(--danger);}
  .sw-blue{background:var(--reviewed);}

  .btn{
    background:var(--navy-600); border:1px solid var(--line); color:var(--text-hi);
    padding:7px 12px; border-radius:7px; font-size:12.5px; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent-soft);}
  .btn.primary{background:var(--accent); color:#1a0e06; border-color:var(--accent); font-weight:700;}
  .btn.primary:hover{background:var(--accent-soft);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn.ghost{background:transparent;}
  .btn.small{padding:5px 9px; font-size:11.5px;}

  /* ---------- drawing viewer ---------- */
  .viewer{flex:1; min-height:0; position:relative; overflow:hidden; background:
    repeating-linear-gradient(45deg, #12161d 0 10px, #14181f 10px 20px);
    cursor:grab;
  }
  .viewer.dragging{cursor:grabbing;}
  .viewer-world{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;}
  .viewer-world img{display:block; max-width:none; -webkit-user-drag:none; user-select:none; pointer-events:none;}
  .marker{
    position:absolute; border:2px solid; border-radius:3px; box-sizing:border-box;
    background:rgba(0,0,0,0); cursor:pointer; pointer-events:auto;
  }
  .marker::after{
    content:attr(data-idx); position:absolute; top:-1px; left:-1px; transform:translate(-100%,-100%);
    font-size:9px; font-family:'JetBrains Mono'; padding:0 3px; border-radius:3px 3px 3px 0;
    color:#0a0d12; opacity:0; transition:opacity .1s;
  }
  .marker.tier-green{border-color:var(--ok); background:rgba(63,166,107,.10);}
  .marker.tier-amber{border-color:var(--warn); background:rgba(217,164,65,.14);}
  .marker.tier-red{border-color:var(--danger); background:rgba(226,96,74,.20); box-shadow:0 0 0 2px rgba(226,96,74,.18);}
  .marker.tier-reviewed{border-color:var(--reviewed); background:rgba(91,141,217,.14);}
  .marker.selected{outline:2px solid #fff; outline-offset:2px; z-index:5;}
  .marker:hover::after{opacity:.9; background:currentColor;}

  .zoom-hint{
    position:absolute; bottom:12px; left:14px; font-size:11px; color:var(--text-lo);
    background:rgba(10,13,18,.7); padding:6px 10px; border-radius:7px; pointer-events:none;
  }
  .minimap-scale{position:absolute; top:12px; left:14px; font-size:11px; color:var(--text-lo);
    background:rgba(10,13,18,.7); padding:6px 10px; border-radius:7px; font-family:'JetBrains Mono';}

  /* ---------- right panel ---------- */
  .panel{
    width:380px; flex:none; background:var(--navy-800); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .panel-head{padding:16px 18px 12px; border-bottom:1px solid var(--line);}
  .panel-head h2{margin:0 0 4px; font-size:15px;}
  .progress-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .progress-track{flex:1; height:7px; background:var(--navy-600); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--reviewed),#8fb6ec); border-radius:99px; transition:width .2s;}
  .progress-num{font-size:11.5px; color:var(--text-lo); font-family:'JetBrains Mono'; white-space:nowrap;}

  .detail{padding:16px 18px; border-bottom:1px solid var(--line);}
  .detail .empty{color:var(--text-lo); font-size:13px; line-height:1.7;}
  .detail-text{font-size:22px; font-weight:700; font-family:'JetBrains Mono'; word-break:break-all; margin-bottom:8px;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 9px; border-radius:99px; font-weight:700; margin-bottom:10px;}
  .badge.tier-green{background:var(--ok-bg); color:#8fe0b0;}
  .badge.tier-amber{background:var(--warn-bg); color:#f0cd8a;}
  .badge.tier-red{background:var(--danger-bg); color:#f4a898;}
  .badge.tier-reviewed{background:var(--reviewed-bg); color:#aecaf2;}
  .reason{font-size:12.5px; color:var(--text-lo); line-height:1.6; margin-bottom:12px;}
  .coords{font-size:11px; color:var(--text-lo); font-family:'JetBrains Mono'; margin-bottom:14px;}
  .correct-row{display:flex; gap:8px; margin-bottom:8px;}
  .correct-row input{
    flex:1; background:var(--navy-600); border:1px solid var(--line); border-radius:7px;
    color:var(--text-hi); padding:8px 10px; font-family:'JetBrains Mono'; font-size:13px;
  }
  .action-row{display:flex; gap:8px;}
  .action-row .btn{flex:1; justify-content:center;}

  .list{flex:1; overflow-y:auto; padding:8px 10px;}
  .list-item{
    display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; cursor:pointer;
    font-size:12.5px; margin-bottom:2px; border:1px solid transparent;
  }
  .list-item:hover{background:var(--navy-700);}
  .list-item.selected{background:var(--navy-600); border-color:var(--line);}
  .dot{width:8px;height:8px;border-radius:50%; flex:none;}
  .dot.tier-green{background:var(--ok);}
  .dot.tier-amber{background:var(--warn);}
  .dot.tier-red{background:var(--danger);}
  .dot.tier-reviewed{background:var(--reviewed);}
  .list-item .t{font-family:'JetBrains Mono'; font-weight:500;}
  .list-item .r{margin-left:auto; font-size:10.5px; color:var(--text-lo);}

  .gate-bar{padding:14px 18px; border-top:1px solid var(--line); background:var(--navy-700);}
  .gate-bar .msg{font-size:11.5px; color:var(--text-lo); margin-bottom:8px; line-height:1.6;}
  .gate-bar .btn{width:100%; justify-content:center; padding:11px;}
  .gate-bar .skip{display:block; text-align:center; margin-top:8px; font-size:10.5px; color:var(--text-lo); text-decoration:underline; cursor:pointer;}

  /* ---------- inference cards ---------- */
  .cards-wrap{flex:1; overflow-y:auto; padding:26px; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; align-content:start;}
  .card{
    background:var(--navy-700); border:1px solid var(--line); border-radius:14px; padding:18px;
    display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--accent-soft);}
  .card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .card.reviewed{opacity:.7;}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card .title{font-size:13px; color:var(--text-lo); font-weight:500;}
  .card .value{font-size:19px; font-weight:700; font-family:'JetBrains Mono';}
  .card .note{font-size:12px; color:var(--text-lo); line-height:1.6;}
  .card .foot{display:flex; justify-content:space-between; align-items:center; margin-top:4px;}
  .stamp{font-size:10px; font-weight:700; letter-spacing:.04em; padding:4px 8px; border-radius:5px;}
  .stamp.tier-reviewed{background:var(--reviewed-bg); color:#aecaf2;}

  /* ---------- 3D tab ---------- */
  .scene-wrap{flex:1; position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 20%, #1c2536, #0d1119 78%);}
  .scene3d{position:absolute; inset:0; perspective:1500px; display:flex; align-items:center; justify-content:center; cursor:grab;}
  .scene3d.dragging{cursor:grabbing;}
  .world3d{position:relative; transform-style:preserve-3d; width:1px; height:1px;}
  .face{position:absolute; transform-style:preserve-3d; display:flex; align-items:center; justify-content:center; text-align:center; box-sizing:border-box;}
  .face.floor{background:rgba(255,255,255,.03); border:1px dashed var(--danger); }
  .face.wall-unknown{background:rgba(226,96,74,.07); border:1.5px dashed var(--danger);}
  .face.ceiling{background:rgba(63,166,107,.14); border:1.5px solid var(--ok);}
  .face-label{position:absolute; font-size:11px; color:var(--text-lo); font-family:'JetBrains Mono'; background:rgba(10,13,18,.55); padding:3px 8px; border-radius:5px; white-space:nowrap; pointer-events:none;}
  .face-label.ok{color:#8fe0b0;}
  .face-label.danger{color:#f4a898;}
  .marker3d{
    position:absolute; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
    border-radius:6px; font-family:'JetBrains Mono'; font-size:10.5px; font-weight:700; cursor:pointer;
    transform-style:preserve-3d; padding:4px; text-align:center; line-height:1.3;
  }
  .marker3d.tier-green{background:rgba(63,166,107,.32); border:1.5px solid var(--ok); color:#d3f5e0;}
  .marker3d.tier-red{background:rgba(226,96,74,.34); border:1.5px solid var(--danger); color:#ffd9d0; animation:pulse3d 1.8s ease-in-out infinite;}
  @keyframes pulse3d{0%,100%{box-shadow:0 0 0 0 rgba(226,96,74,.5);} 50%{box-shadow:0 0 0 8px rgba(226,96,74,0);}}
  .scene-controls{position:absolute; top:14px; left:14px; display:flex; flex-direction:column; gap:8px; z-index:6;}
  .scene-controls .row{display:flex; gap:8px;}
  .scene-caption{position:absolute; bottom:14px; left:14px; right:14px; font-size:11.5px; color:var(--text-lo);
    background:rgba(10,13,18,.72); padding:10px 14px; border-radius:9px; line-height:1.7; max-width:560px;}
  .scene-caption b{color:var(--text-hi);}

  @media (max-width:860px){
    .main{flex-direction:column;}
    .panel{width:100%; border-left:none; border-top:1px solid var(--line); max-height:46vh;}
    .cards-wrap{grid-template-columns:1fr;}
  }

  #errBanner{
    display:none; position:fixed; top:0; left:0; right:0; z-index:999;
    background:#4a1712; color:#ffd9d0; border-bottom:2px solid var(--danger);
    padding:12px 18px; font-family:'JetBrains Mono',monospace; font-size:12.5px; white-space:pre-wrap;
  }
  #imgFallback{
    display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:var(--danger); font-size:13px; text-align:center; padding:30px;
  }
</style>
<div id="errBanner"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">識</div>
      <div>
        <h1>読取り検証デスク</h1>
        <div class="sub mono">__PROJECT_LABEL__</div>
      </div>
    </div>
    <div class="tabs" id="tabStrip"></div>
  </div>

  <div class="main">
    <div class="stage" id="stage"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
/* ===================== diagnostics: surface any runtime error visibly ===================== */
function showErr(msg){
  const b = document.getElementById('errBanner');
  if(!b) return;
  b.style.display = 'block';
  b.textContent = '⚠ 表示エラーが発生しました。この内容をそのままご報告ください:\n' + msg;
}
window.addEventListener('error', (e)=> showErr((e.error && e.error.stack) || e.message));
window.addEventListener('unhandledrejection', (e)=> showErr(String(e.reason && e.reason.stack || e.reason)));

/* ===================== real extracted data (drawing_ai.vector_extractor) ===================== */
const WORDS = __WORDS_JSON__;

const IMG = __IMG_JSON__;
const ACTIVE_PAGE = __ACTIVE_PAGE__;
const DB_DOC_PATH = __DB_DOC_PATH_JSON__;

const CARDS = __CARDS_JSON__;

const TABS = [
  {id:'text', label:'① 文字識別', sub:'記号・注記のラベル'},
  {id:'numeric', label:'② 数字識別', sub:'寸法・型番数値'},
  {id:'infer', label:'③ 意味推論', sub:'構造化・深掘り'},
  {id:'3d', label:'④ 3D理解', sub:'空間としての把握'},
];

/* ===================== state ===================== */
const state = {
  tab: 'text',
  unlocked: {text:true, numeric:false, infer:false, '3d':false},
  reviewed: {}, // id -> {status:'ok'|'fixed', value?}
  selected: null,
  view: {x:80, y:60, scale:0.34},
};
try{
  const saved = JSON.parse(localStorage.getItem(DB_DOC_PATH)||'null');
  if(saved){ Object.assign(state.unlocked, saved.unlocked||{}); Object.assign(state.reviewed, saved.reviewed||{}); }
}catch(e){}

function persist(){
  try{ localStorage.setItem(DB_DOC_PATH, JSON.stringify({unlocked:state.unlocked, reviewed:state.reviewed})); }catch(e){}
  persistToDb();
}

/* ===================== durable server-side backup =====================
   localStorage alone is per-browser only -- if this page is ever
   redeployed with a fix, or opened on another device, that data isn't
   there. The db capability keeps one shared document that survives any
   future republish, so completed review work is never at risk. */
let _dbDocPromise = null;
async function getReviewDoc(){
  if(_dbDocPromise) return _dbDocPromise;
  _dbDocPromise = (async ()=>{
    if(typeof claude === 'undefined' || !claude.use) return null;
    const db = await claude.use('db');
    if(!db) return null;
    return db.doc(DB_DOC_PATH);
  })();
  return _dbDocPromise;
}

async function loadFromDb(){
  try{
    const doc = await getReviewDoc();
    if(!doc) return; // db not available in this view -- localStorage is still in effect
    const snap = await doc.get();
    if(snap.exists){
      const data = snap.data();
      Object.assign(state.unlocked, data.unlocked||{});
      Object.assign(state.reviewed, data.reviewed||{});
      persistLocalOnly();
      renderAll();
    } else {
      // first time db has been available for this artifact -- seed it
      // from whatever is already in this browser's localStorage so
      // earlier review work (done before this backup existed) isn't lost.
      await doc.set({unlocked: state.unlocked, reviewed: state.reviewed, updatedAt: new Date().toISOString()});
    }
  }catch(e){ /* db unavailable or transient -- localStorage remains the working copy */ }
}
function persistLocalOnly(){
  try{ localStorage.setItem(DB_DOC_PATH, JSON.stringify({unlocked:state.unlocked, reviewed:state.reviewed})); }catch(e){}
}
async function persistToDb(){
  try{
    const doc = await getReviewDoc();
    if(!doc) return;
    await doc.set({unlocked: state.unlocked, reviewed: state.reviewed, updatedAt: new Date().toISOString()});
  }catch(e){ /* best-effort -- localStorage already has the authoritative local copy */ }
}

function itemsOf(tabId){
  if(tabId==='text') return WORDS[ACTIVE_PAGE].filter(w=>w.channel==='text');
  if(tabId==='numeric') return WORDS[ACTIVE_PAGE].filter(w=>w.channel==='numeric');
  if(tabId==='infer') return CARDS;
  return [];
}
function needsReviewCount(tabId){
  const items = itemsOf(tabId);
  const flagged = items.filter(i => i.tier!=='green');
  const done = flagged.filter(i => state.reviewed[i.id]);
  return {flagged: flagged.length, done: done.length, total: items.length};
}
function tierOf(item){
  if(state.reviewed[item.id]) return 'reviewed';
  return item.tier;
}

/* ===================== tab strip ===================== */
function renderTabs(){
  const strip = document.getElementById('tabStrip');
  strip.innerHTML = '';
  TABS.forEach(t=>{
    const counts = t.id==='3d' ? null : needsReviewCount(t.id);
    const el = document.createElement('div');
    const locked = !state.unlocked[t.id];
    el.className = 'tab' + (state.tab===t.id?' active':'') + (locked?' locked':'');
    el.innerHTML = `${locked?'<span class="lock">🔒</span>':''}<span>${t.label}</span>` +
      (counts && counts.flagged>0 ? `<span class="pill">${counts.done}/${counts.flagged} 要確認</span>` : (counts? `<span class="pill">${counts.total} 件</span>`:''));
    el.onclick = () => { if(!locked){ state.tab = t.id; state.selected=null; renderAll(); } };
    strip.appendChild(el);
  });
}

/* ===================== drawing viewer (tabs: text / numeric) ===================== */
function renderViewerStage(channel){
  const img = IMG[ACTIVE_PAGE];
  const items = itemsOf(channel);
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="stage-toolbar">
      <button class="btn small" id="btnFit">画面に合わせる</button>
      <button class="btn small" id="btnZoomIn">＋ 拡大</button>
      <button class="btn small" id="btnZoomOut">－ 縮小</button>
      <span class="mono" style="font-size:11.5px;color:var(--text-lo)">${img.label} ・ 実寸 ${img.w}×${img.h}px</span>
      <div class="legend">
        <div class="legend-item"><span class="swatch sw-green"></span>確信(パターン一致)</div>
        <div class="legend-item"><span class="swatch sw-amber"></span>要軽確認</div>
        <div class="legend-item"><span class="swatch sw-red"></span>誤読の疑い</div>
        <div class="legend-item"><span class="swatch sw-blue"></span>人間確認済み</div>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <div class="viewer-world" id="viewerWorld">
        <img id="viewerImg" src="${img.src}" width="${img.w}" height="${img.h}"
             style="max-width:none; width:${img.w}px; height:${img.h}px;">
        ${items.map((it,i)=>{
          const mw = Math.max(it.x1-it.x0, 22);
          const mh = Math.max(it.y1-it.y0, 22);
          const cx = (it.x0+it.x1)/2, cy=(it.y0+it.y1)/2;
          return `<div class="marker tier-${tierOf(it)}" data-id="${it.id}" data-idx="${i+1}"
               style="left:${cx-mw/2}px; top:${cy-mh/2}px; width:${mw}px; height:${mh}px;"></div>`;
        }).join('')}
      </div>
      <div id="imgFallback">
        <div>⚠ 図面画像 (${img.src}) の読み込みに失敗しました。<br>ネットワーク環境やブラウザのキャッシュをご確認のうえ、再読み込みしてください。</div>
      </div>
      <div class="minimap-scale mono">ホイールでズーム / ドラッグでパン ・ 項目 ${items.length}件</div>
      <div class="zoom-hint mono" id="zoomHint"></div>
    </div>
  `;
  document.getElementById('viewerImg').onerror = ()=>{ document.getElementById('imgFallback').style.display = 'flex'; };
  setupViewerInteraction();
  document.querySelectorAll('.marker').forEach(m=>{
    m.onclick = (e)=>{ e.stopPropagation(); selectItem(m.dataset.id, true); };
  });
  document.getElementById('btnFit').onclick = fitView;
  document.getElementById('btnZoomIn').onclick = ()=>zoomBy(1.35);
  document.getElementById('btnZoomOut').onclick = ()=>zoomBy(1/1.35);
  fitView();
}

let drag = null;
function setupViewerInteraction(){
  const viewer = document.getElementById('viewer');
  viewer.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect = viewer.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    zoomAt(mx,my,factor);
  }, {passive:false});
  viewer.addEventListener('pointerdown', (e)=>{
    if(e.target.classList.contains('marker')) return;
    drag = {sx:e.clientX, sy:e.clientY, ox:state.view.x, oy:state.view.y};
    viewer.classList.add('dragging');
    viewer.setPointerCapture(e.pointerId);
  });
  viewer.addEventListener('pointermove', (e)=>{
    if(!drag) return;
    state.view.x = drag.ox + (e.clientX-drag.sx);
    state.view.y = drag.oy + (e.clientY-drag.sy);
    applyView();
  });
  ['pointerup','pointercancel'].forEach(ev=>viewer.addEventListener(ev, ()=>{ drag=null; viewer.classList.remove('dragging'); }));
}
function applyView(){
  const w = document.getElementById('viewerWorld');
  if(!w) return;
  w.style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.scale})`;
  const hint = document.getElementById('zoomHint');
  if(hint) hint.textContent = `表示倍率 ${(state.view.scale*100).toFixed(0)}%`;
}
function zoomAt(px,py,factor){
  const ns = Math.min(6, Math.max(0.08, state.view.scale*factor));
  const k = ns/state.view.scale;
  state.view.x = px - (px-state.view.x)*k;
  state.view.y = py - (py-state.view.y)*k;
  state.view.scale = ns;
  applyView();
}
function zoomBy(factor){
  const viewer = document.getElementById('viewer');
  const r = viewer.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, factor);
}
function fitView(){
  const viewer = document.getElementById('viewer');
  if(!viewer) return;
  const r = viewer.getBoundingClientRect();
  const img = IMG[ACTIVE_PAGE];
  if(r.width < 10 || r.height < 10){
    // layout not settled yet -- retry next frame instead of dividing by
    // a near-zero size, which would collapse the whole world to scale 0
    // (image + every marker invisible and unclickable).
    requestAnimationFrame(fitView);
    return;
  }
  const s = Math.min(1.6, Math.max(0.05, Math.min(r.width/img.w, r.height/img.h) * 0.94));
  state.view.scale = s;
  state.view.x = (r.width - img.w*s)/2;
  state.view.y = (r.height - img.h*s)/2;
  applyView();
}
function focusItem(it){
  const viewer = document.getElementById('viewer');
  const r = viewer.getBoundingClientRect();
  const cx = (it.x0+it.x1)/2, cy = (it.y0+it.y1)/2;
  const ns = 3.2;
  state.view.scale = ns;
  state.view.x = r.width/2 - cx*ns;
  state.view.y = r.height/2 - cy*ns;
  applyView();
}

/* ===================== selection + right panel ===================== */
function selectItem(id, jump){
  state.selected = id;
  const item = itemsOf(state.tab).find(x=>x.id===id);
  if(jump && item && state.tab!=='infer' && state.tab!=='3d') focusItem(item);
  renderPanel();
  document.querySelectorAll('.marker').forEach(m=> m.classList.toggle('selected', m.dataset.id===id));
  document.querySelectorAll('.list-item').forEach(m=> m.classList.toggle('selected', m.dataset.id===id));
  document.querySelectorAll('.card').forEach(m=> m.classList.toggle('selected', m.dataset.id===id));
}

function markReviewed(id, status, value){
  state.reviewed[id] = {status, value: value||null};
  persist();
  renderAll();
  selectItem(id,false);
}

function renderPanel(){
  const panel = document.getElementById('panel');
  const tabId = state.tab;

  if(tabId==='3d'){ renderPanel3D(panel); return; }

  const items = itemsOf(tabId);
  const counts = needsReviewCount(tabId);
  const sel = items.find(x=>x.id===state.selected);

  let detailHtml;
  if(!sel){
    detailHtml = `<div class="empty">左の図面上の枠、または下の一覧から項目をクリックすると、読み取り内容がここに表示されます。</div>`;
  } else if(tabId==='infer'){
    detailHtml = renderInferDetail(sel);
  } else {
    const tier = tierOf(sel);
    detailHtml = `
      <div class="detail-text">${escapeHtml(sel.text)}</div>
      <div class="badge tier-${tier}">${tierLabel(tier)}</div>
      <div class="reason">${escapeHtml(sel.reason)}</div>
      <div class="coords">bbox: (${sel.x0.toFixed(0)}, ${sel.y0.toFixed(0)}) – (${sel.x1.toFixed(0)}, ${sel.y1.toFixed(0)}) px</div>
      ${statusLine(sel.id)}
      ${sel.tier!=='green' ? `
        <div class="correct-row"><input id="fixInput" placeholder="正しい値を入力(修正する場合)" value="${state.reviewed[sel.id]&&state.reviewed[sel.id].value||''}"></div>
        <div class="action-row">
          <button class="btn" id="btnOkAsIs">この読み取りでOK</button>
          <button class="btn primary" id="btnFix">修正して確定</button>
        </div>
        <button class="btn ghost small" id="btnBadRegion" style="width:100%; justify-content:center; margin-top:8px; color:var(--text-lo);">⚠ そもそも識別範囲(枠)自体がずれている・対象を捉えていない</button>
        ` : `<div class="reason" style="color:var(--ok);opacity:.85;">この読み取りは高確度パターンに一致しています。個別確認は不要です。</div>`}
    `;
  }

  panel.innerHTML = `
    <div class="panel-head">
      <h2>${TABS.find(t=>t.id===tabId).label}</h2>
      <div class="sub mono" style="font-size:11px;color:var(--text-lo)">${TABS.find(t=>t.id===tabId).sub}</div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${counts.flagged? (counts.done/counts.flagged*100):100}%"></div></div>
        <div class="progress-num">${counts.done}/${counts.flagged} 要確認レビュー済</div>
      </div>
    </div>
    <div class="detail" id="detailBox">${detailHtml}</div>
    <div class="list" id="listBox"></div>
    ${renderGateBar(tabId, counts)}
  `;

  const listBox = document.getElementById('listBox');
  items.forEach((it, i)=>{
    const t = tierOf(it);
    const row = document.createElement('div');
    row.className = 'list-item' + (it.id===state.selected?' selected':'');
    row.dataset.id = it.id;
    const label = tabId==='infer' ? it.title : it.text;
    row.innerHTML = `<span class="dot tier-${t}"></span><span class="t">${escapeHtml(label)}</span><span class="r">${tierShort(t)}</span>`;
    row.onclick = ()=> selectItem(it.id, true);
    listBox.appendChild(row);
  });

  if(sel && sel.tier!=='green'){
    document.getElementById('btnOkAsIs').onclick = ()=> markReviewed(sel.id,'ok');
    document.getElementById('btnFix').onclick = ()=>{
      const v = document.getElementById('fixInput').value.trim();
      markReviewed(sel.id,'fixed', v || '(修正値未入力)');
    };
    const badRegionBtn = document.getElementById('btnBadRegion');
    if(badRegionBtn) badRegionBtn.onclick = ()=>{
      const v = document.getElementById('fixInput').value.trim();
      markReviewed(sel.id,'bad_region', v || '(識別範囲そのものが対象を正しく捉えていないため、内容の確認・修正が不可能)');
    };
  }
  wireGateBar(tabId);
}

function statusLine(id){
  const r = state.reviewed[id];
  if(!r) return '';
  const labels = {ok:'この読み取りでOK', fixed:'修正して確定', bad_region:'⚠ 識別範囲自体が誤り(修正不可として記録)'};
  return `<div class="reason" style="color:var(--reviewed);opacity:.9;">前回の対応: ${labels[r.status]||r.status}${r.value?(' — 「'+escapeHtml(r.value)+'」'):''}</div>`;
}

function renderInferDetail(card){
  const tier = tierOf(card);
  return `
    <div class="detail-text" style="font-size:18px;">${escapeHtml(card.value)}</div>
    <div class="badge tier-${tier}">${tierLabel(tier)}</div>
    <div class="reason">${escapeHtml(card.note)}</div>
    <div class="coords">根拠トークン: ${card.evidence.length? card.evidence.join(', ') : '(なし ― 未検出であること自体が結論)'}</div>
    ${statusLine(card.id)}
    ${card.tier!=='green' ? `
      <div class="correct-row"><input id="fixInput" placeholder="補足メモ・修正内容(任意)" value="${state.reviewed[card.id]&&state.reviewed[card.id].value||''}"></div>
      <div class="action-row">
        <button class="btn" id="btnOkAsIs">この推論でOK</button>
        <button class="btn primary" id="btnFix">メモを付けて確定</button>
      </div>
      <button class="btn ghost small" id="btnBadRegion" style="width:100%; justify-content:center; margin-top:8px; color:var(--text-lo);">⚠ そもそも根拠トークンの識別範囲が対象を正しく捉えていない(判断不可)</button>
      ` : `<div class="reason" style="color:var(--ok);opacity:.85;">高確度の推論です。個別確認は不要です。</div>`}
  `;
}

function renderGateBar(tabId, counts){
  const idx = TABS.findIndex(t=>t.id===tabId);
  const next = TABS[idx+1];
  if(!next) return '';
  const ready = counts.done >= counts.flagged;
  return `
    <div class="gate-bar">
      <div class="msg">${ready
        ? `このシートの要確認項目はすべてレビューされました。次の段階(${next.label})に進めます。`
        : `赤・黄の項目を確認してから次の段階に進んでください(残り ${counts.flagged-counts.done} 件)。`}
      </div>
      <button class="btn primary" id="btnGate" ${ready?'':'disabled'}>OK, 次へ進む → ${next.label}</button>
      ${!ready ? `<span class="skip" id="btnSkip">レビュー未完了のまま進む(非推奨)</span>` : ''}
    </div>
  `;
}
function wireGateBar(tabId){
  const idx = TABS.findIndex(t=>t.id===tabId);
  const next = TABS[idx+1];
  if(!next) return;
  const gateBtn = document.getElementById('btnGate');
  const skip = document.getElementById('btnSkip');
  if(gateBtn) gateBtn.onclick = ()=>{ state.unlocked[next.id]=true; persist(); state.tab=next.id; state.selected=null; renderAll(); };
  if(skip) skip.onclick = ()=>{ state.unlocked[next.id]=true; persist(); state.tab=next.id; state.selected=null; renderAll(); };
}

function tierLabel(t){ return {green:'確信(パターン一致)', amber:'要軽確認', red:'誤読の疑い ー 未確認', reviewed:'人間確認済み'}[t]||t; }
function tierShort(t){ return {green:'済', amber:'△', red:'未確認', reviewed:'確認済'}[t]||''; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildScene(){
  const world = document.getElementById('world3d');
  const W=480, D=480, H=300; // display units (schematic -- real footprint unknown)
  world.innerHTML = '';

  function face(cls, w,h, tx,ty,tz, rx,ry, label, labelCls){
    const f = document.createElement('div');
    f.className = 'face '+cls;
    f.style.width = w+'px'; f.style.height = h+'px';
    f.style.left = (-w/2)+'px'; f.style.top = (-h/2)+'px';
    f.style.transform = `translate3d(${tx}px,${ty}px,${tz}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    if(label){
      const lb = document.createElement('div');
      lb.className = 'face-label '+(labelCls||'');
      lb.style.transform = 'translateZ(1px)';
      lb.textContent = label;
      f.appendChild(lb);
    }
    world.appendChild(f);
    return f;
  }

  // floor (unknown footprint)
  face('floor', W, D, 0, H/2, 0, 90, 0, '床: 外形寸法 不明', 'danger');
  // ceiling (confirmed height)
  face('ceiling', W, D, 0, -H/2, 0, 90, 0, '天井高 2400〜2425mm(実測トークン確認済み)', 'ok');
  // 4 walls, all unconfirmed footprint -> red dashed
  face('wall-unknown', W, H, 0, 0, D/2, 0, 0, '正面壁: 幅寸法 不明', 'danger');
  face('wall-unknown', W, H, 0, 0, -D/2, 0, 180, '背面壁: 幅寸法 不明', 'danger');
  face('wall-unknown', D, H, W/2, 0, 0, 0, 90, '側壁: 奥行寸法 不明', 'danger');
  face('wall-unknown', D, H, -W/2, 0, 0, 0, -90, '側壁: 奥行寸法 不明', 'danger');

  // door/opening markers, placed schematically along the front wall
  const openings = [
    {card:'op-a', w:60, h:70, xfrac:0.20},
    {card:'op-c', w:110, h:70, xfrac:0.50},
    {card:'op-b', w:66, h:66, xfrac:0.80},
  ];
  openings.forEach(o=>{
    const card = CARDS.find(c=>c.id===o.card);
    const t = tierOf(card);
    const m = document.createElement('div');
    m.className = 'marker3d tier-'+(t==='reviewed'?'green':t);
    m.style.width = o.w+'px'; m.style.height = o.h+'px';
    const x = -W/2 + o.xfrac*W;
    const z = D/2 + 2;
    m.style.left = (-o.w/2)+'px';
    m.style.top = (-o.h/2)+'px';
    m.style.transform = `translate3d(${x}px, ${H/2 - o.h/2 - 8}px, ${z}px)`;
    m.dataset.id = card.id;
    m.innerHTML = `<div>${card.value.split(' ')[0]}</div><div style="opacity:.75;">${card.value.split('×')[1]?('×'+card.value.split('×')[1].trim()):''}</div>`;
    m.onclick = (e)=>{ e.stopPropagation(); state.tab='infer'; state.unlocked.infer=true; state.selected=card.id; renderAll(); };
    world.appendChild(m);
  });

  // the low-confidence cluster, floating near a side wall
  const clusterCard = CARDS.find(c=>c.id==='cluster-unclear');
  const cm = document.createElement('div');
  cm.className = 'marker3d tier-red';
  cm.style.width='96px'; cm.style.height='60px';
  cm.style.left='-48px'; cm.style.top='-30px';
  cm.style.transform = `translate3d(${-W/2-2}px, ${H/2-40}px, ${D*0.15}px) rotateY(90deg)`;
  cm.innerHTML = `<div>要確認</div><div style="opacity:.75;font-size:9px;">建具表クラスタ</div>`;
  cm.onclick = (e)=>{ e.stopPropagation(); state.tab='infer'; state.unlocked.infer=true; state.selected=clusterCard.id; renderAll(); };
  world.appendChild(cm);
}

function apply3D(){
  const world = document.getElementById('world3d');
  if(!world) return;
  world.style.transform = `scale(${rot3d.scale}) rotateX(${rot3d.rx}deg) rotateY(${rot3d.ry}deg)`;
}
function setup3DInteraction(){
  const scene = document.getElementById('scene3d');
  scene.addEventListener('pointerdown', (e)=>{
    drag3d = {sx:e.clientX, sy:e.clientY, rx:rot3d.rx, ry:rot3d.ry};
    scene.classList.add('dragging');
    scene.setPointerCapture(e.pointerId);
  });
  scene.addEventListener('pointermove', (e)=>{
    if(!drag3d) return;
    rot3d.ry = drag3d.ry + (e.clientX-drag3d.sx)*0.4;
    rot3d.rx = Math.max(-85, Math.min(85, drag3d.rx - (e.clientY-drag3d.sy)*0.4));
    apply3D();
  });
  ['pointerup','pointercancel'].forEach(ev=>scene.addEventListener(ev, ()=>{ drag3d=null; scene.classList.remove('dragging'); }));
  scene.addEventListener('wheel', (e)=>{
    e.preventDefault();
    rot3d.scale = Math.min(2.2, Math.max(0.4, rot3d.scale * (e.deltaY<0?1.1:1/1.1)));
    apply3D();
  }, {passive:false});
}
