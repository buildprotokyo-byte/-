[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildpro-estimate-ai"
version = "0.1.0"
description = "自動積算AI: 建設図面の自動読み取り・自動積算エンジン"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = [
    "axes",
    "axes.image_axis",
    "axes.absolute_rule_axis",
    "axes.reading",
    "arbitration",
    "intake",
    "estimating",
    "killer_question",
    "benchmarks",
]

[tool.setuptools.package-data]
# K-49: AI に図面を読ませる指示文(コードに埋め込まずファイルに置く)。
intake = ["ai_reading_instructions.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
