# Cost posture (see drawing_ai/README.md 3.16/3.17): the feature that's
# actually wired into the 見積作成 tab today -- POST /phase1/analyze,
# character/number recognition -- uses Tesseract only and calls no paid API,
# so it costs nothing beyond Render hosting itself. `plan: free` below keeps
# that hosting free too (real limits: spins down on idle, cold starts on the
# next request -- acceptable for now, see README).
#
# The DRAWING_AI_CHILD_*/PARENT_* vars point the existing OpenAI-compatible
# VLM client at Anthropic's documented OpenAI SDK compatibility layer
# (https://api.anthropic.com/v1/, confirmed via
# platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk) --
# this is for the FULL Phase0-3 pipeline (POST /analyze), which the
# 見積作成 tab does not call yet. Leave DRAWING_AI_CHILD_API_KEY /
# DRAWING_AI_PARENT_API_KEY BLANK for now: nothing calls that pipeline, so
# an unset key costs nothing and risks nothing. Fill them in only when
# deliberately moving past Phase 1 to real VLM-backed reading -- at that
# point, and only then, does usage-based Anthropic billing begin.
services:
  - type: web
    name: buildpro-drawing-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DRAWING_AI_CHILD_BASE_URL
        value: https://api.anthropic.com/v1/
      - key: DRAWING_AI_CHILD_MODEL
        value: claude-sonnet-5
      - key: DRAWING_AI_CHILD_API_KEY
        sync: false
      - key: DRAWING_AI_PARENT_BASE_URL
        value: https://api.anthropic.com/v1/
      - key: DRAWING_AI_PARENT_MODEL
        value: claude-haiku-4-5-20251001
      - key: DRAWING_AI_PARENT_API_KEY
        sync: false
      - key: DRAWING_AI_OCR_ENGINE
        value: tesseract
        # Render's default Python runtime doesn't have the `tesseract-ocr`
        # system binary installed (only the pytesseract Python wrapper would
        # be). ocr_engine.py already degrades gracefully (logs a warning,
        # falls back to no OCR-grounding signal) rather than failing the
        # whole pipeline -- see drawing_ai/README.md 3.16. Fixing this
        # properly needs a Dockerfile-based Render deploy instead of the
        # plain Python buildCommand above; deferred for the same reason as
        # the free plan choice -- don't add cost/complexity before the free
        # tier proves the feature is worth it.
